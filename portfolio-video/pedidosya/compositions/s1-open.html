<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          background: #0c0a0b;
          font-family: "IBM Plex Mono", monospace;
          color: #f5f1f2;
        }
        .s1-grid {
          position: absolute;
          inset: -40px;
          background-image: linear-gradient(#241c1e 1px, transparent 1px),
            linear-gradient(90deg, #241c1e 1px, transparent 1px);
          background-size: 80px 80px;
          opacity: 0.28;
        }
        .s1-radial {
          position: absolute;
          left: -240px;
          bottom: -320px;
          width: 1180px;
          height: 1180px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(255, 45, 85, 0.2) 0%, rgba(255, 45, 85, 0) 62%);
        }
        .s1-net,
        .s1-pulse-layer {
          position: absolute;
          right: -60px;
          top: 0;
          width: 1180px;
          height: 1080px;
        }
        /* The pulse layer must match the SVG box exactly: `offset-path`
           resolves against the containing block, not SVG user space. */
        .s1-pulse-layer {
          pointer-events: none;
        }
        .s1-link {
          fill: none;
          stroke: #7a8794;
          stroke-width: 1.6;
          opacity: 0.5;
        }
        .s1-link-hot {
          stroke: #ff2d55;
          stroke-width: 2.2;
          opacity: 0.85;
        }
        .s1-node {
          fill: #0c0a0b;
          stroke: #8a8084;
          stroke-width: 2;
        }
        .s1-node-hot {
          fill: #ff2d55;
          stroke: #ff2d55;
        }
        .s1-pulse {
          width: 9px;
          height: 9px;
          border-radius: 50%;
          background: #ff2d55;
          position: absolute;
          top: 0;
          left: 0;
          offset-rotate: 0deg;
        }
        .s1-copy {
          position: absolute;
          left: 120px;
          top: 318px;
          width: 1020px;
        }
        .s1-kicker {
          font-size: 19px;
          letter-spacing: 0.34em;
          text-transform: uppercase;
          color: #ff2d55;
          margin-bottom: 30px;
          display: flex;
          align-items: center;
          gap: 18px;
        }
        .s1-kicker-rule {
          height: 1px;
          width: 64px;
          background: #ff2d55;
          display: block;
          transform-origin: left center;
        }
        .s1-mask {
          overflow: hidden;
          display: block;
        }
        .s1-title {
          font-family: "Archivo Black", sans-serif;
          font-weight: 400;
          font-size: 116px;
          line-height: 1.02;
          letter-spacing: -0.035em;
          margin: 0;
          display: block;
        }
        .s1-title-accent {
          color: #ff2d55;
        }
        .s1-spine {
          margin-top: 40px;
          font-size: 23px;
          letter-spacing: 0.2em;
          text-transform: uppercase;
          color: #8a8084;
        }
        .s1-tag {
          margin-top: 20px;
          font-size: 29px;
          line-height: 1.45;
          color: #f5f1f2;
          max-width: 820px;
        }
        .s1-foot {
          position: absolute;
          left: 120px;
          bottom: 64px;
          font-size: 17px;
          letter-spacing: 0.12em;
          text-transform: uppercase;
          color: #8a8084;
        }
      </style>

      <div id="root" data-composition-id="s1-open" data-width="1920" data-height="1080" data-duration="3.8">
        <div class="s1-grid" id="s1-grid" data-layout-allow-overflow></div>
        <div class="s1-radial" id="s1-radial" data-layout-allow-overflow></div>

        <svg class="s1-net" id="s1-net" viewBox="0 0 1180 1080" fill="none" data-layout-allow-overflow>
          <g id="s1-links"></g>
          <g id="s1-nodes"></g>
        </svg>
        <div class="s1-pulse-layer" id="s1-pulse-layer" data-layout-allow-overflow></div>

        <div class="s1-copy">
          <div class="s1-kicker" id="s1-kicker">
            <i class="s1-kicker-rule" id="s1-kicker-rule"></i>
            <span id="s1-kicker-text">Independent operations case study</span>
          </div>
          <span class="s1-mask"><span class="s1-title" id="s1-title-a">DELIVERY OPERATIONS</span></span>
          <span class="s1-mask"
            ><span class="s1-title s1-title-accent" id="s1-title-b">INTELLIGENCE</span></span
          >
          <div class="s1-spine" id="s1-spine">334,144 orders · 32 days · 4 raw sources</div>
          <div class="s1-tag" id="s1-tag">
            From raw operational data to decisions that survive scrutiny.
          </div>
        </div>

        <div class="s1-foot" id="s1-foot">Santino Cervio · Industrial Engineering — ITBA</div>
      </div>

      <script>
        (() => {
          // Schematic dispatch network. The dataset carries no coordinates
          // (only pu_distance / do_distance in assumed metres), so these
          // positions are authored, not geographic, and are fixed constants.
          const NODES = [
            { x: 150, y: 190, r: 7, hot: false },
            { x: 372, y: 108, r: 5, hot: false },
            { x: 560, y: 256, r: 9, hot: true },
            { x: 316, y: 352, r: 6, hot: false },
            { x: 122, y: 470, r: 5, hot: false },
            { x: 528, y: 520, r: 7, hot: false },
            { x: 792, y: 384, r: 6, hot: false },
            { x: 930, y: 196, r: 5, hot: false },
            { x: 706, y: 660, r: 9, hot: true },
            { x: 372, y: 700, r: 6, hot: false },
            { x: 156, y: 812, r: 5, hot: false },
            { x: 560, y: 890, r: 7, hot: false },
            { x: 884, y: 828, r: 6, hot: false },
            { x: 1020, y: 560, r: 5, hot: false },
            { x: 940, y: 980, r: 5, hot: false },
          ];
          const LINKS = [
            [0, 1, -50], [1, 2, 44], [0, 3, 40], [3, 2, -36], [3, 4, 34],
            [2, 6, 52], [6, 7, -46], [2, 5, -40], [5, 8, 46], [6, 8, -38],
            [5, 9, 36], [9, 10, -30], [9, 11, 40], [11, 8, -44], [8, 12, 38],
            [12, 14, -28], [6, 13, 42], [13, 8, -34], [4, 9, -42], [7, 13, 36],
          ];
          const HOT = new Set([1, 4, 8, 13]);

          const arc = (a, b, bow) => {
            const mx = (a.x + b.x) / 2;
            const my = (a.y + b.y) / 2;
            const dx = b.x - a.x;
            const dy = b.y - a.y;
            const len = Math.hypot(dx, dy) || 1;
            const cx = mx + (-dy / len) * bow;
            const cy = my + (dx / len) * bow;
            return `M ${a.x} ${a.y} Q ${cx} ${cy} ${b.x} ${b.y}`;
          };

          const linkGroup = document.getElementById("s1-links");
          const nodeGroup = document.getElementById("s1-nodes");
          const paths = [];

          LINKS.forEach(([i, j, bow], index) => {
            const d = arc(NODES[i], NODES[j], bow);
            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            path.setAttribute("d", d);
            path.setAttribute("pathLength", "100");
            path.setAttribute("class", HOT.has(index) ? "s1-link s1-link-hot" : "s1-link");
            linkGroup.appendChild(path);
            paths.push({ el: path, d, hot: HOT.has(index) });
          });

          NODES.forEach((n) => {
            const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            c.setAttribute("cx", n.x);
            c.setAttribute("cy", n.y);
            c.setAttribute("r", n.r);
            c.setAttribute("class", n.hot ? "s1-node s1-node-hot" : "s1-node");
            nodeGroup.appendChild(c);
          });

          // Order pulses travel the hot links via offset-path — no DOM measurement.
          // They live in a layer whose box matches the SVG 1:1, so the path
          // coordinates below are the same numbers the SVG already uses.
          const pulseLayer = document.getElementById("s1-pulse-layer");
          const pulses = paths
            .filter((p) => p.hot)
            .map((p) => {
              const dot = document.createElement("i");
              dot.className = "s1-pulse";
              dot.style.offsetPath = `path("${p.d}")`;
              pulseLayer.appendChild(dot);
              return dot;
            });

          const tl = gsap.timeline({ paused: true });

          tl.fromTo(
            "#s1-grid",
            { opacity: 0, x: -14 },
            { opacity: 0.28, x: 0, duration: 1.1, ease: "power2.out" },
            0
          )
            .fromTo(
              "#s1-radial",
              { opacity: 0, scale: 0.82 },
              { opacity: 1, scale: 1, duration: 1.6, ease: "power2.out" },
              0
            )
            .to("#s1-radial", { scale: 1.06, duration: 2.2, ease: "sine.inOut" }, 1.6);

          paths.forEach((p, index) => {
            tl.fromTo(
              p.el,
              { strokeDasharray: 100, strokeDashoffset: 100 },
              { strokeDashoffset: 0, duration: 0.9, ease: "power2.out" },
              0.06 + index * 0.022
            );
          });

          tl.fromTo(
            "#s1-nodes circle",
            { scale: 0, transformOrigin: "center center" },
            { scale: 1, duration: 0.42, ease: "power3.out", stagger: 0.022 },
            0.34
          );

          pulses.forEach((dot, index) => {
            tl.fromTo(
              dot,
              { offsetDistance: "0%", opacity: 0 },
              { offsetDistance: "100%", opacity: 1, duration: 1.5, ease: "none" },
              0.7 + index * 0.24
            ).to(dot, { opacity: 0, duration: 0.24, ease: "power1.in" }, ">-0.24");
          });

          tl.fromTo(
            "#s1-kicker-rule",
            { scaleX: 0 },
            { scaleX: 1, duration: 0.44, ease: "power3.out" },
            0.5
          )
            .fromTo(
              "#s1-kicker-text",
              { opacity: 0, x: -12 },
              { opacity: 1, x: 0, duration: 0.44, ease: "power3.out" },
              0.58
            )
            .fromTo(
              "#s1-title-a",
              { yPercent: 108 },
              { yPercent: 0, duration: 0.72, ease: "power3.out" },
              0.72
            )
            .fromTo(
              "#s1-title-b",
              { yPercent: 108 },
              { yPercent: 0, duration: 0.72, ease: "power3.out" },
              0.86
            )
            .fromTo(
              "#s1-spine",
              { opacity: 0, y: 16 },
              { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
              1.24
            )
            .fromTo(
              "#s1-tag",
              { opacity: 0, y: 18 },
              { opacity: 1, y: 0, duration: 0.56, ease: "power3.out" },
              1.38
            )
            .fromTo(
              "#s1-foot",
              { opacity: 0 },
              { opacity: 1, duration: 0.5, ease: "power2.out" },
              1.7
            );

          // Slow ambient drift carries into the cut.
          tl.to(["#s1-net", "#s1-pulse-layer"], { x: -18, duration: 3.8, ease: "none" }, 0);

          window.__timelines["s1-open"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
