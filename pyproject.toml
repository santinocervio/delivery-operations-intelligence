[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "delivery-operations-intelligence"
version = "1.0.0"
description = "Reproducible observational analysis of delivery operations"
requires-python = ">=3.12"
dependencies = ["pandas>=2.2,<4", "numpy>=2,<3", "openpyxl>=3.1", "pyarrow>=18", "scipy>=1.14", "statsmodels>=0.14", "streamlit>=1.40", "plotly>=5.24"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["delivery_ops*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
